<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Active Cabin OS</title>
    <link rel="stylesheet" href="/static/styles.css?v=8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="canvas" id="canvas">
        <!-- z-0: 背景壁纸视频 -->
        <video class="bg-video" id="bg-video" autoplay muted loop playsinline>
            <source src="/static/videos/HMI.mp4" type="video/mp4">
        </video>

        <!-- z-50: Unity 覆盖层 -->
        <div class="unity-overlay" id="unity-overlay">
            <div class="unity-card">
                <canvas id="unity-canvas" tabindex="-1"></canvas>
                <div class="unity-loading" id="unity-loading">
                    <div class="unity-loading-content">
                        <span class="unity-loading-text">Loading 3D Scene...</span>
                        <div class="unity-progress">
                            <div class="unity-progress-bar" id="unity-progress-bar"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- z-100: 主 UI 层 — 三分区 -->
        <div class="hmi-main" id="hmi-main">

            <!-- 顶部状态栏 -->
            <div class="top-bar">
                <div class="top-bar-left">
                    <span class="top-status-item">
                        <span class="status-dot online"></span>
                        <span>Connected</span>
                    </span>
                    <span class="top-status-item">
                        <span class="autopilot-badge">AP</span>
                        <span>AutoPilot</span>
                    </span>
                </div>
                <div class="top-bar-center">
                </div>
                <div class="top-bar-right">
                    <span class="top-status-item" id="main-time"></span>
                </div>
            </div>

            <!-- 三分区内容 -->
            <div class="zones">
                <!-- 左区：ADAS / 驾驶 -->
                <div class="zone zone-left">
                    <div class="glass-card adas-card">
                        <div class="card-header">
                            <span class="card-title">ADAS</span>
                            <span class="card-badge">Active</span>
                        </div>
                        <div class="adas-visual">
                            <canvas id="adas-canvas"></canvas>
                        </div>
                    </div>
                    <div class="glass-card speed-card">
                        <div class="speed-row">
                            <div class="speed-display">
                                <span class="speed-number" id="speed-number">89</span>
                                <span class="speed-unit">km/h</span>
                            </div>
                            <div class="speed-meta">
                                <span class="gear-indicator" id="gear-indicator">D</span>
                                <span class="power-value" id="power-value">63 kW</span>
                            </div>
                            <div class="drive-bars">
                                <div class="drive-bar throttle-bar">
                                    <span class="bar-label">THR</span>
                                    <div class="bar-track"><div class="bar-fill bar-fill-throttle" id="throttle-fill"></div></div>
                                </div>
                                <div class="drive-bar brake-bar">
                                    <span class="bar-label">BRK</span>
                                    <div class="bar-track"><div class="bar-fill bar-fill-brake" id="brake-fill"></div></div>
                                </div>
                            </div>
                            <div class="steer-display">
                                <span class="steer-icon">⟳</span>
                                <span class="steer-value" id="steer-value">0°</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 中区：导航 -->
                <div class="zone zone-center">
                    <div class="glass-card nav-card">
                        <div class="card-header">
                            <span class="card-title">Navigation</span>
                        </div>
                        <div class="nav-visual">
                            <canvas id="nav-canvas"></canvas>
                        </div>
                        <div class="nav-info">
                            <span class="nav-dest">—</span>
                            <span class="nav-eta"></span>
                        </div>
                    </div>
                </div>

                <!-- 右区：动态卡片横排（4槽位） -->
                <div class="zone zone-right" id="zone-right">
                    <div class="right-strip" id="right-strip"></div>
                </div>
            </div>

        </div>

        <!-- 底部 Dock（独立层级，始终可见） -->
        <div class="dock" id="dock">
            <div class="dock-inner">
                <div class="dock-item" data-action="nav" id="dock-nav">
                    <svg class="dock-icon" viewBox="0 0 24 24" fill="none">
                        <path d="M3 11l19-9-9 19-2-8-8-2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="dock-item" data-action="adas" id="dock-adas">
                    <svg class="dock-icon" viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
                        <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="dock-item" data-action="ai" id="dock-ai">
                    <svg class="dock-icon" viewBox="0 0 24 24" fill="none">
                        <path d="M12 2a7 7 0 017 7v3a7 7 0 01-14 0V9a7 7 0 017-7z" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="dock-item" data-action="service" id="dock-service">
                    <svg class="dock-icon" viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                        <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                        <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                        <rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                </div>
                <div class="dock-item" data-action="cabin" id="dock-cabin">
                    <svg class="dock-icon" viewBox="0 0 24 24" fill="none">
                        <path d="M3 12l9-9 9 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M5 10v9a2 2 0 002 2h10a2 2 0 002-2v-9" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                </div>
                <div class="dock-item" data-action="3d" id="dock-3d">
                    <svg class="dock-icon" viewBox="0 0 24 24" fill="none">
                        <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                        <path d="M2 17l10 5 10-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- 服务二级面板 -->
        <div class="service-panel" id="service-panel">
            <div class="service-panel-header">
                <span class="service-panel-title">Services</span>
                <button class="service-close-btn" id="service-close-btn">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <div class="service-grid">
                <div class="service-item" data-service="alipay">
                    <div class="service-icon app-icon"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#1677FF"/><path d="M8 16h4m4 0h4m-6-4v8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></div>
                    <span>Alipay</span>
                </div>
                <div class="service-item" data-service="ctrip">
                    <div class="service-icon app-icon"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#2681FF"/><circle cx="16" cy="14" r="5" stroke="#fff" stroke-width="1.5"/><path d="M10 24c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="#fff" stroke-width="1.5"/></svg></div>
                    <span>Ctrip</span>
                </div>
                <div class="service-item" data-service="music">
                    <div class="service-icon app-icon"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#FC3C44"/><circle cx="13" cy="21" r="3" stroke="#fff" stroke-width="1.5"/><path d="M16 21V9l6-2v12" stroke="#fff" stroke-width="1.5"/><circle cx="22" cy="19" r="2.5" stroke="#fff" stroke-width="1.5"/></svg></div>
                    <span>Music</span>
                </div>
                <div class="service-item" data-service="bilibili">
                    <div class="service-icon app-icon"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#FB7299"/><path d="M10 12h12v10a2 2 0 01-2 2H12a2 2 0 01-2-2V12z" fill="#fff"/><path d="M12 9l3 3M20 9l-3 3" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><circle cx="14" cy="17" r="1.5" fill="#FB7299"/><circle cx="18" cy="17" r="1.5" fill="#FB7299"/></svg></div>
                    <span>Bilibili</span>
                </div>
                <div class="service-item" data-service="parking">
                    <div class="service-icon app-icon"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#5856D6"/><text x="16" y="21" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">P</text></svg></div>
                    <span>Parking</span>
                </div>
                <div class="service-item" data-service="charging">
                    <div class="service-icon app-icon"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#34C759"/><path d="M17 8l-5 9h5l-1 7 6-10h-5l1-6z" fill="#fff"/></svg></div>
                    <span>Charging</span>
                </div>
                <div class="service-item" data-service="news">
                    <div class="service-icon app-icon"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#FF3B30"/><rect x="9" y="9" width="14" height="14" rx="2" stroke="#fff" stroke-width="1.5"/><path d="M12 14h8M12 17h5" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg></div>
                    <span>News</span>
                </div>
            </div>
        </div>

        <!-- Bilibili 视频选择面板（三级面板） -->
        <div class="bili-select-panel" id="bili-select-panel">
            <div class="bili-select-header">
                <span class="bili-select-title">Bilibili · Select Video</span>
                <button class="service-close-btn" id="bili-select-close">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <div class="bili-select-grid" id="bili-select-grid"></div>
        </div>

        <!-- NOVA 语音对话浮动面板 -->
        <div class="nova-overlay" id="nova-overlay" style="display:none;">
            <div class="nova-orb" id="nova-orb">
                <div class="nova-pulse-ring"></div>
                <div class="nova-pulse-ring nova-pulse-ring-2"></div>
                <div class="nova-icon">N</div>
            </div>
            <div class="nova-content">
                <div class="nova-transcript" id="nova-transcript"></div>
                <div class="nova-reply" id="nova-reply"></div>
            </div>
            <div class="nova-state" id="nova-state">Ready</div>
        </div>

        <!-- 待机锁屏 -->
        <div class="lockscreen" id="lockscreen">
            <img class="lockscreen-bg" src="/static/wallpaper/9e84f9358b77a634fb1d2751f8a8731.png" alt="">
            <div class="lockscreen-content">
                <div class="lock-time" id="lock-time">14:36</div>
                <div class="lock-date" id="lock-date"></div>
                <div class="lock-weather" id="lock-weather">28°C · Sunny</div>
                <div class="lock-hint">Tap anywhere to start</div>
            </div>
        </div>
    </div>

    <script src="/static/unity/ai-car-scene/Build/AI4HMI.loader.js" onerror="console.warn('Unity loader not found, 3D scene unavailable')"></script>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="/static/volc-rtc.min.js"></script>
    <script src="/static/app.js?v=36"></script>
    <script src="/static/voice.js?v=8"></script>
</body>
</html>

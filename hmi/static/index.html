<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Active Cabin OS</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="canvas" id="canvas">
        <!-- 背景壁纸视频 -->
        <video class="bg-video" id="bg-video" autoplay muted loop playsinline>
            <source src="/static/videos/HMI.mp4" type="video/mp4">
        </video>

        <!-- 底部汽车 Logo 按钮 -->
        <div class="car-logo-btn" id="car-logo-btn">
            <svg class="car-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 38L16 24C17.5 19 20 17 24 17H40C44 17 46.5 19 48 24L52 38" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <rect x="8" y="38" width="48" height="16" rx="4" stroke="currentColor" stroke-width="2"/>
                <circle cx="18" cy="46" r="4" stroke="currentColor" stroke-width="2"/>
                <circle cx="46" cy="46" r="4" stroke="currentColor" stroke-width="2"/>
                <line x1="24" y1="24" x2="40" y2="24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </div>

        <!-- Unity 覆盖卡片（不遮挡底部 logo） -->
        <div class="unity-overlay" id="unity-overlay">
            <div class="unity-card">
                <canvas id="unity-canvas" tabindex="-1"></canvas>
                <div class="unity-loading" id="unity-loading">
                    <div class="unity-loading-content">
                        <span class="unity-loading-text">Loading 3D Scene...</span>
                        <div class="unity-progress">
                            <div class="unity-progress-bar" id="unity-progress-bar"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/unity/ai-car-scene/Build/AI4HMI.loader.js" onerror="console.warn('Unity loader not found, 3D scene unavailable')"></script>
    <script src="/static/app.js"></script>
</body>
</html>
